<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stay Focused | SyncFocus</title>
    <link rel="stylesheet" href="blocked.css">
</head>

<body>
    <main>
        <div class="logo">S</div>

        <span id="status" class="status">Checking status...</span>

        <h1 id="heading">Stay focused.</h1>

        <p id="description">
            Checking your SyncFocus settings.
        </p>

        <div id="note" class="note" aria-live="polite">
            SyncFocus is checking whether this website is still blocked.
        </div>

        <button id="checkBtn" type="button">
            Check again
        </button>
    </main>

    <script src="blocked.js">
    </script>
</body>
</html>
